services:
  weather4agents-api:
    image: giogdev/weather4agents:latest
    container_name: weather4agents-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Relative host path so the compose file works on Linux/macOS out of the box.
      # Windows users: see the README for how to use an absolute host path instead.
      - ./weather-data:/app/weather-data

    restart: unless-stopped
